<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Reto 02-B — Banner con background-image, cover y position</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="wrapper">
    <section class="hero-card">
      <div class="hero-contenido">
        <span class="tag-hero">BACKGROUND-SIZE: COVER</span>
        <h1>Expedición a la Cordillera Azul</h1>
        <p>
          Cuando necesitas texto superpuesto con contraste perfecto, combina
          <code>background-image</code>, <code>background-size: cover</code>,
          <code>background-position: center</code> y <code>background-repeat: no-repeat</code>.
        </p>
        <a href="#" class="btn-reserva">Reservar Cupo</a>
      </div>
    </section>
  </main>
</body>
</html>
